name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:          # 允许在 GitHub Actions 页面手动触发

jobs:
  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置镜像标签
        id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: 设置 Docker Buildx（支持缓存加速）
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送所有服务镜像
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker compose -f deploy/compose.yaml build \
            --build-arg BUILDKIT_INLINE_CACHE=1
          docker compose -f deploy/compose.yaml push
          # 同时打一个 latest 标签方便 Coolify 拉取
          for svc in gateway identity workflow media blog-rag bookmark web; do
            img="ghcr.io/${{ github.repository }}/${svc}"
            docker tag "${img}:${IMAGE_TAG}" "${img}:latest"
            docker push "${img}:latest"
          done

  deploy:
    name: 通知 Coolify 重新部署
    runs-on: ubuntu-latest
    needs: build
    if: ${{ vars.COOLIFY_WEBHOOK_URL != '' || secrets.COOLIFY_WEBHOOK_URL != '' }}
    steps:
      - name: 触发 Coolify 重新拉取并重启
        run: |
          WEBHOOK="${{ secrets.COOLIFY_WEBHOOK_URL }}"
          TOKEN="${{ secrets.COOLIFY_TOKEN }}"
          if [ -z "$WEBHOOK" ]; then
            echo "未配置 COOLIFY_WEBHOOK_URL，跳过部署通知"
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$WEBHOOK" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json"
          echo "✅ 已通知 Coolify 重新部署"
