name: ai-platform

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    profiles: ["minio"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123456}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  gateway:
    build: ../services/gateway
    image: ghcr.io/${GITHUB_REPOSITORY:-local/ai-platform}/gateway:${IMAGE_TAG:-dev}
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      IDENTITY_URL: http://identity:8000
      WORKFLOW_URL: http://workflow:8000
      MEDIA_URL: http://media:8000
      BLOG_URL: http://blog-rag:8000
      BOOKMARK_URL: http://bookmark:8000
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      - identity
      - workflow
      - media
      - blog-rag
      - bookmark

  identity:
    build: ../services/identity
    image: ghcr.io/${GITHUB_REPOSITORY:-local/ai-platform}/identity:${IMAGE_TAG:-dev}
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/identity
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
    depends_on:
      postgres:
        condition: service_healthy

  workflow:
    build: ../services/workflow
    image: ghcr.io/${GITHUB_REPOSITORY:-local/ai-platform}/workflow:${IMAGE_TAG:-dev}
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/workflow
      CHECKPOINT_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/agent
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      MEDIA_URL: http://media:8000
    depends_on:
      postgres:
        condition: service_healthy

  media:
    build: ../services/media
    image: ghcr.io/${GITHUB_REPOSITORY:-local/ai-platform}/media:${IMAGE_TAG:-dev}
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/media
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123456}
      MINIO_BUCKET: media
      LOCAL_STORAGE: /data/objects
    volumes:
      - media_objects:/data/objects
    depends_on:
      postgres:
        condition: service_healthy

  blog-rag:
    build: ../services/blog_rag
    image: ghcr.io/${GITHUB_REPOSITORY:-local/ai-platform}/blog-rag:${IMAGE_TAG:-dev}
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/blog
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    depends_on:
      postgres:
        condition: service_healthy

  bookmark:
    build: ../services/bookmark
    image: ghcr.io/${GITHUB_REPOSITORY:-local/ai-platform}/bookmark:${IMAGE_TAG:-dev}
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/bookmark
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123456}
      MINIO_BUCKET: bookmarks
      LOCAL_STORAGE: /data/objects
    volumes:
      - bookmark_objects:/data/objects
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ../apps/web
    image: ghcr.io/${GITHUB_REPOSITORY:-local/ai-platform}/web:${IMAGE_TAG:-dev}
    ports:
      - "8080:80"
    depends_on:
      - gateway

volumes:
  postgres_data:
  minio_data:
  media_objects:
  bookmark_objects:
